name: monorepo-ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  brain:
    name: rust brain (cargo)
    runs-on: macos-14
    steps:
      # actions pinned by commit SHA per repo security policy
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, resolved 2026-07-19
      - name: install ripgrep (the Glob/Grep builtins shell out to rg)
        run: brew install ripgrep
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: gate contract e2e (deterministic, no model)
        run: bash tests/e2e/gate-contract.sh
      - name: "immunity loop e2e (m2: capture -> ingest -> promote -> block)"
        run: bash tests/e2e/immunity-loop.sh
